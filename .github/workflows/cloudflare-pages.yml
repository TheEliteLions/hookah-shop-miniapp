name: Deploy Cloudflare Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_PAGES_PROJECT != '' && vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_PUBLISHABLE_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_PUBLIC_SIGNUP_ENABLED: ${{ vars.VITE_PUBLIC_SIGNUP_ENABLED || 'false' }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
